syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/empty.proto";

option go_package = "gen/api/v1";

service InstanceService {
  // Gets the instance profile.
  rpc GetInstanceProfile(GetInstanceProfileRequest) returns (InstanceProfile) {
    option (google.api.http) = {get: "/api/v1/instance/profile"};
  }

  // Gets an instance setting.
  rpc GetInstanceSetting(GetInstanceSettingRequest) returns (InstanceSetting) {
    option (google.api.http) = {get: "/api/v1/{name=instance/settings/*}"};
    option (google.api.method_signature) = "name";
  }

  // Updates an instance setting.
  rpc UpdateInstanceSetting(UpdateInstanceSettingRequest) returns (InstanceSetting) {
    option (google.api.http) = {
      patch: "/api/v1/{setting.name=instance/settings/*}"
      body: "setting"
    };
    option (google.api.method_signature) = "setting,update_mask";
  }

  // UploadCoverImage uploads a cover image to the server.
  rpc UploadCoverImage(UploadCoverImageRequest) returns (UploadCoverImageResponse) {
    option (google.api.http) = {
      post: "/api/v1/cover:upload"
      body: "*"
    };
  }

  // ListCoverImages lists previously uploaded cover images.
  rpc ListCoverImages(ListCoverImagesRequest) returns (ListCoverImagesResponse) {
    option (google.api.http) = {get: "/api/v1/covers"};
  }

  // DeleteCoverImage deletes a previously uploaded cover image.
  rpc DeleteCoverImage(DeleteCoverImageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/covers/{filename}"};
  }
}

// Instance profile message containing basic instance information.
message InstanceProfile {
  // Version is the current version of instance.
  string version = 2;

  // Demo indicates if the instance is in demo mode.
  bool demo = 3;

  // Instance URL is the URL of the instance.
  string instance_url = 6;

  // Indicates if the instance has completed first-time setup.
  // When false, the instance requires initialization (creating the first admin account).
  // This follows the pattern used by other self-hosted platforms for setup workflows.
  bool initialized = 7;
}

// Request for instance profile.
message GetInstanceProfileRequest {}

// An instance setting resource.
message InstanceSetting {
  option (google.api.resource) = {
    type: "memos.api.v1/InstanceSetting"
    pattern: "instance/settings/{setting}"
    singular: "instanceSetting"
    plural: "instanceSettings"
  };

  // The name of the instance setting.
  // Format: instance/settings/{setting}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  oneof value {
    GeneralSetting general_setting = 2;
    StorageSetting storage_setting = 3;
    MemoRelatedSetting memo_related_setting = 4;
    TodoSetting todo_setting = 5;
    CoverStorageSetting cover_storage_setting = 6;
  }

  // Enumeration of instance setting keys.
  enum Key {
    KEY_UNSPECIFIED = 0;
    // GENERAL is the key for general settings.
    GENERAL = 1;
    // STORAGE is the key for storage settings.
    STORAGE = 2;
    // MEMO_RELATED is the key for memo related settings.
    MEMO_RELATED = 3;
    // TODO is the key for todo settings.
    TODO = 4;
    // COVER_STORAGE is the key for cover image storage settings.
    COVER_STORAGE = 5;
  }

  // General instance settings configuration.
  message GeneralSetting {
    // disallow_user_registration disallows user registration.
    bool disallow_user_registration = 2;
    // disallow_password_auth disallows password authentication.
    bool disallow_password_auth = 3;
    // additional_script is the additional script.
    string additional_script = 4;
    // additional_style is the additional style.
    string additional_style = 5;
    // custom_profile is the custom profile.
    CustomProfile custom_profile = 6;
    // week_start_day_offset is the week start day offset from Sunday.
    // 0: Sunday, 1: Monday, 2: Tuesday, 3: Wednesday, 4: Thursday, 5: Friday, 6: Saturday
    // Default is Sunday.
    int32 week_start_day_offset = 7;

    // disallow_change_username disallows changing username.
    bool disallow_change_username = 8;
    // disallow_change_nickname disallows changing nickname.
    bool disallow_change_nickname = 9;

    // Custom profile configuration for instance branding.
    message CustomProfile {
      string title = 1;
      string description = 2;
      string logo_url = 3;
      string cover_url = 4;
    }
  }

  // Storage configuration settings for instance attachments.
  message StorageSetting {
    // Storage type enumeration for different storage backends.
    enum StorageType {
      STORAGE_TYPE_UNSPECIFIED = 0;
      // DATABASE is the database storage type.
      DATABASE = 1;
      // LOCAL is the local storage type.
      LOCAL = 2;
      // S3 is the S3 storage type.
      S3 = 3;
    }
    // storage_type is the storage type.
    StorageType storage_type = 1;
    // The template of file path.
    // e.g. assets/{timestamp}_{filename}
    string filepath_template = 2;
    // The max upload size in megabytes.
    int64 upload_size_limit_mb = 3;

    // S3 configuration for cloud storage backend.
    // Reference: https://developers.cloudflare.com/r2/examples/aws/aws-sdk-go/
    message S3Config {
      string access_key_id = 1;
      string access_key_secret = 2;
      string endpoint = 3;
      string region = 4;
      string bucket = 5;
      bool use_path_style = 6;
    }
    // The S3 config.
    S3Config s3_config = 4;
  }

  // Cover image storage settings.
  message CoverStorageSetting {
    // Local directory path for cover images.
    string directory_path = 1;
    // URL prefix for accessing cover images.
    string url_prefix = 2;
    // Whether to enable local HTTP server for cover images.
    bool enable_local_server = 3;
    // The max upload size in megabytes.
    int64 upload_size_limit_mb = 4;
  }

  // Memo-related instance settings and policies.
  message MemoRelatedSetting {
    // disallow_public_visibility disallows set memo as public visibility.
    bool disallow_public_visibility = 1;
    // display_with_update_time orders and displays memo with update time.
    bool display_with_update_time = 2;
    // content_length_limit is the limit of content length. Unit is byte.
    int32 content_length_limit = 3;
    // enable_double_click_edit enables editing on double click.
    bool enable_double_click_edit = 4;
    // reactions is the list of reactions.
    repeated string reactions = 7;
  }

  // Todo-related instance settings and policies.
  message TodoSetting {
    // reminder_day_offsets specifies when to send reminders before due date.
    // Example: [1, 3] means 1 day and 3 days before.
    repeated int32 reminder_day_offsets = 1;
  }
}

// Request message for GetInstanceSetting method.
message GetInstanceSettingRequest {
  // The resource name of the instance setting.
  // Format: instance/settings/{setting}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "memos.api.v1/InstanceSetting"}
  ];
}

// Request message for UpdateInstanceSetting method.
message UpdateInstanceSettingRequest {
  // The instance setting resource which replaces the resource on the server.
  InstanceSetting setting = 1 [(google.api.field_behavior) = REQUIRED];

  // The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message CoverImage {
  // The filename of the cover image.
  string filename = 1;
  // The URL of the cover image.
  string url = 2;
  // The creation timestamp in seconds.
  int64 create_time = 3;
  // The size of the image in bytes.
  int64 size = 4;
}

message UploadCoverImageRequest {
  // Required. The image filename.
  string filename = 1 [(google.api.field_behavior) = REQUIRED];
  // Required. The image content.
  bytes content = 2 [(google.api.field_behavior) = REQUIRED];
}

message UploadCoverImageResponse {
  CoverImage image = 1;
}

message ListCoverImagesRequest {
  // Optional. The maximum number of cover images to return.
  int32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];
  // Optional. A page token, received from a previous `ListCoverImages` call.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ListCoverImagesResponse {
  repeated CoverImage images = 1;
  string next_page_token = 2;
  int32 total_size = 3;
}

message DeleteCoverImageRequest {
  // Required. The filename of the cover image to delete.
  string filename = 1 [(google.api.field_behavior) = REQUIRED];
}
