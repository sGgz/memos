syntax = "proto3";

package memos.api.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/api/v1";

service LoanService {
  // CreateBank creates a bank.
  rpc CreateBank(CreateBankRequest) returns (Bank) {
    option (google.api.http) = {
      post: "/api/v1/banks"
      body: "bank"
    };
    option (google.api.method_signature) = "bank";
  }

  // ListBanks lists banks.
  rpc ListBanks(ListBanksRequest) returns (ListBanksResponse) {
    option (google.api.http) = {get: "/api/v1/banks"};
  }

  // UpdateBank updates a bank.
  rpc UpdateBank(UpdateBankRequest) returns (Bank) {
    option (google.api.http) = {
      patch: "/api/v1/{bank.name=banks/*}"
      body: "bank"
    };
    option (google.api.method_signature) = "bank,update_mask";
  }

  // DeleteBank deletes a bank.
  rpc DeleteBank(DeleteBankRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=banks/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreateLoan creates a loan.
  rpc CreateLoan(CreateLoanRequest) returns (Loan) {
    option (google.api.http) = {
      post: "/api/v1/loans"
      body: "loan"
    };
    option (google.api.method_signature) = "loan";
  }

  // ListLoans lists loans.
  rpc ListLoans(ListLoansRequest) returns (ListLoansResponse) {
    option (google.api.http) = {get: "/api/v1/loans"};
  }

  // GetLoan gets a loan by name.
  rpc GetLoan(GetLoanRequest) returns (Loan) {
    option (google.api.http) = {get: "/api/v1/{name=loans/*}"};
    option (google.api.method_signature) = "name";
  }

  // UpdateLoan updates a loan.
  rpc UpdateLoan(UpdateLoanRequest) returns (Loan) {
    option (google.api.http) = {
      patch: "/api/v1/{loan.name=loans/*}"
      body: "loan"
    };
    option (google.api.method_signature) = "loan,update_mask";
  }

  // DeleteLoan deletes a loan.
  rpc DeleteLoan(DeleteLoanRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=loans/*}"};
    option (google.api.method_signature) = "name";
  }

  // CreateRepayment creates a repayment record.
  rpc CreateRepayment(CreateRepaymentRequest) returns (Repayment) {
    option (google.api.http) = {
      post: "/api/v1/{parent=loans/*}/repayments"
      body: "repayment"
    };
    option (google.api.method_signature) = "parent,repayment";
  }

  // ListRepayments lists repayment records for a loan.
  rpc ListRepayments(ListRepaymentsRequest) returns (ListRepaymentsResponse) {
    option (google.api.http) = {get: "/api/v1/{parent=loans/*}/repayments"};
    option (google.api.method_signature) = "parent";
  }

  // UpdateRepayment updates a repayment record.
  rpc UpdateRepayment(UpdateRepaymentRequest) returns (Repayment) {
    option (google.api.http) = {
      patch: "/api/v1/{repayment.name=loans/*/repayments/*}"
      body: "repayment"
    };
    option (google.api.method_signature) = "repayment,update_mask";
  }

  // DeleteRepayment deletes a repayment record.
  rpc DeleteRepayment(DeleteRepaymentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/v1/{name=loans/*/repayments/*}"};
    option (google.api.method_signature) = "name";
  }
}

enum RepaymentMethod {
  REPAYMENT_METHOD_UNSPECIFIED = 0;
  REPAYMENT_METHOD_EQUAL_INSTALLMENT = 1;
  REPAYMENT_METHOD_EQUAL_PRINCIPAL = 2;
  REPAYMENT_METHOD_INTEREST_ONLY = 3;
  REPAYMENT_METHOD_FLEXIBLE = 4;
  REPAYMENT_METHOD_EQUAL_PRINCIPAL_INTEREST = 5;
}

message Bank {
  option (google.api.resource) = {
    type: "memos.api.v1/Bank"
    pattern: "banks/{bank}"
    name_field: "name"
    singular: "bank"
    plural: "banks"
  };

  // The resource name of the bank.
  // Format: banks/{bank}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update timestamp.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The bank display name.
  string title = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The bank description.
  string description = 5 [(google.api.field_behavior) = OPTIONAL];
}

message Loan {
  option (google.api.resource) = {
    type: "memos.api.v1/Loan"
    pattern: "loans/{loan}"
    name_field: "name"
    singular: "loan"
    plural: "loans"
  };

  // The resource name of the loan.
  // Format: loans/{loan}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update timestamp.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The loan title.
  string title = 4 [(google.api.field_behavior) = REQUIRED];

  // Optional. The loan description.
  string description = 5 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The bank name.
  // Format: banks/{bank}
  string bank = 6 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The principal amount in cents.
  int64 principal_cents = 7 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The interest rate in basis points.
  int32 interest_rate_bps = 8 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The start date.
  google.protobuf.Timestamp start_time = 9 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The next repayment date.
  google.protobuf.Timestamp next_repayment_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The total repaid principal in cents.
  int64 repaid_principal_cents = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The total repaid interest in cents.
  int64 repaid_interest_cents = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The total repaid amount in cents.
  int64 repaid_amount_cents = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The remaining principal in cents.
  int64 remaining_principal_cents = 14 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The order index for display.
  optional int32 order_index = 15 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The monthly repayment day (1-31).
  int32 monthly_repayment_day = 16 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The repayment term in years.
  int32 repayment_periods = 17 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The repayment method.
  RepaymentMethod repayment_method = 18 [(google.api.field_behavior) = OPTIONAL];
}

message Repayment {
  option (google.api.resource) = {
    type: "memos.api.v1/Repayment"
    pattern: "loans/{loan}/repayments/{repayment}"
    name_field: "name"
    singular: "repayment"
    plural: "repayments"
  };

  // The resource name of the repayment.
  // Format: loans/{loan}/repayments/{repayment}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Output only. The creation timestamp.
  google.protobuf.Timestamp create_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Output only. The last update timestamp.
  google.protobuf.Timestamp update_time = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Required. The parent loan name.
  // Format: loans/{loan}
  string loan = 4 [(google.api.field_behavior) = REQUIRED];

  // Required. The repayment date.
  google.protobuf.Timestamp repayment_time = 5 [(google.api.field_behavior) = REQUIRED];

  // Required. The principal amount in cents.
  int64 principal_cents = 6 [(google.api.field_behavior) = REQUIRED];

  // Required. The interest amount in cents.
  int64 interest_cents = 7 [(google.api.field_behavior) = REQUIRED];

  // Optional. The total amount in cents.
  int64 total_cents = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The remaining principal in cents after this repayment.
  int64 remaining_principal_cents = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optional. The note for this repayment.
  string note = 10 [(google.api.field_behavior) = OPTIONAL];

  // Optional. Whether the repayment is marked as early repayment.
  bool is_early_repayment = 11 [(google.api.field_behavior) = OPTIONAL];

  // Output only. The period index for on-time repayments.
  optional int32 period = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CreateBankRequest {
  // Required. The bank to create.
  Bank bank = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListBanksRequest {}

message ListBanksResponse {
  repeated Bank banks = 1;
}

message UpdateBankRequest {
  // Required. The bank to update.
  Bank bank = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteBankRequest {
  // Required. The resource name of the bank to delete.
  // Format: banks/{bank}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateLoanRequest {
  // Required. The loan to create.
  Loan loan = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListLoansRequest {}

message ListLoansResponse {
  repeated Loan loans = 1;
}

message GetLoanRequest {
  // Required. The resource name of the loan.
  // Format: loans/{loan}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message UpdateLoanRequest {
  // Required. The loan to update.
  Loan loan = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteLoanRequest {
  // Required. The resource name of the loan to delete.
  // Format: loans/{loan}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateRepaymentRequest {
  // Required. The parent loan name.
  // Format: loans/{loan}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The repayment to create.
  Repayment repayment = 2 [(google.api.field_behavior) = REQUIRED];
}

message ListRepaymentsRequest {
  // Required. The parent loan name.
  // Format: loans/{loan}
  string parent = 1 [(google.api.field_behavior) = REQUIRED];
}

message ListRepaymentsResponse {
  repeated Repayment repayments = 1;
}

message UpdateRepaymentRequest {
  // Required. The repayment to update.
  Repayment repayment = 1 [(google.api.field_behavior) = REQUIRED];

  // Required. The list of fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = REQUIRED];
}

message DeleteRepaymentRequest {
  // Required. The resource name of the repayment to delete.
  // Format: loans/{loan}/repayments/{repayment}
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}
